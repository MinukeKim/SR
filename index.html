<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AX LAB AI Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nanum+Square+Round:wght@400;700;800&display=swap');
        
        body {
            font-family: 'Nanum Square Round', 'Segoe UI', sans-serif;
            background-color: #f97316;
            background-image: radial-gradient(rgba(255,255,255,0.2) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .soft-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5); }
        .comic-border { border: 4px solid #1e293b; }

        input[type="range"] {
            -webkit-appearance: none; appearance: none;
            height: 8px; border-radius: 4px; background: #cbd5e1; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 18px; height: 18px; border-radius: 50%;
            background: #1e293b; border: 2px solid #ffffff; cursor: pointer; transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        .bubble-speaking {
            border-color: #f97316 !important;
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.4);
            animation: pulse-border 1.5s infinite alternate;
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 5px rgba(249, 115, 22, 0.2); }
            100% { box-shadow: 0 0 20px rgba(249, 115, 22, 0.6); }
        }

        .speaking-glow { animation: speak-glow 1.2s infinite alternate; }
        @keyframes speak-glow {
            0% { border-color: #1e293b; box-shadow: 0 0 5px rgba(249, 115, 22, 0.2); }
            100% { border-color: #f97316; box-shadow: 0 0 20px rgba(249, 115, 22, 0.6); }
        }

        /* 캔버스 렌더러 CSS 스케일링 (조금 더 꽉 차 보이도록 max-width 상향) */
        .canvas-responsive {
            width: 100%;
            max-width: 360px;
            height: auto;
            aspect-ratio: 1 / 1;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8 select-none transition-colors duration-500" id="body-bg">

    <div id="start-overlay" class="fixed inset-0 bg-slate-900/90 z-50 flex flex-col items-center justify-center text-white cursor-pointer" onclick="initApp()">
        <span class="text-6xl mb-4">🖐️</span>
        <h2 class="text-2xl font-black font-['Fredoka_One'] mb-2">Click Anywhere to Start!</h2>
        <p class="text-slate-300 font-bold">마이크 셋업을 위해 화면을 클릭해주세요.</p>
    </div>

    <div class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-12 gap-8 bg-[#f8fafc] p-6 md:p-8 rounded-[32px] comic-border soft-shadow transition-colors duration-500">
        
        <!-- HEADER -->
        <div class="lg:col-span-12 flex flex-col md:flex-row items-center justify-between border-b-4 border-[#1e293b] pb-4 mb-2 gap-4">
            <div>
                <h1 class="text-3xl font-black text-slate-900 mt-2 font-['Fredoka_One'] flex items-baseline">
                    AX LAB AI Tutor <span class="text-lg text-slate-500 font-bold ml-3 font-sans">v0.5</span>
                </h1>
            </div>
            
            <div class="flex items-center space-x-4 bg-white p-2 px-4 rounded-2xl border-2 border-slate-200 shadow-inner">
                <div class="flex items-center space-x-2">
                    <span class="text-xl">🔈</span>
                    <input type="range" id="master-vol" min="0" max="1" step="0.1" value="1" class="w-24 accent-slate-800" oninput="updateVolume(this.value)">
                </div>
            </div>
        </div>

        <!-- LEFT PANEL: Character Canvas -->
        <div class="lg:col-span-5 flex flex-col items-center justify-start space-y-6 p-2">
            
            <div class="relative flex items-center justify-center w-full">
                <canvas id="tutorCanvas" width="400" height="400" class="bg-white comic-border soft-shadow canvas-responsive transition-all duration-300"></canvas>
            </div>

            <!-- 캐릭터 토글 -->
            <div class="flex space-x-2 bg-white p-2 rounded-2xl border-2 border-slate-200 shadow-sm w-full justify-center">
                <button id="char-xeno" onclick="setCharacter('xeno')" class="px-8 py-2 text-sm font-black bg-orange-500 text-white rounded-xl transition">Xeno</button>
                <button id="char-xena" onclick="setCharacter('xena')" class="px-8 py-2 text-sm font-black text-slate-500 hover:bg-slate-100 rounded-xl transition">Xena</button>
            </div>
        </div>

        <!-- RIGHT PANEL: Chat -->
        <div class="lg:col-span-7 flex flex-col space-y-6">
            <div class="flex-1 bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-inner flex flex-col gap-6 min-h-[500px]">
                
                <div class="flex justify-between items-center border-b-2 border-slate-100 pb-3 mb-2">
                    <span class="text-sm font-black text-slate-500 uppercase tracking-wide">Live Chat</span>
                    <div class="flex space-x-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
                        <button id="lang-en" onclick="setLanguageMode('en')" class="px-3 py-1 text-xs font-black text-slate-500 hover:bg-slate-200 rounded-lg transition">Eng</button>
                        <button id="lang-ko" onclick="setLanguageMode('ko')" class="px-3 py-1 text-xs font-black text-slate-500 hover:bg-slate-200 rounded-lg transition">Kor</button>
                    </div>
                </div>

                <div class="flex items-start gap-4">
                    <div class="flex flex-col flex-1">
                        <span class="text-xs font-black text-slate-500 ml-2 mb-1">Tutor</span>
                        <div id="tutor-bubble" class="bg-slate-100 text-slate-800 font-bold p-4 rounded-2xl rounded-tl-none border-2 border-slate-200 shadow-sm text-[15px] leading-relaxed transition-all">
                            Ready to start. Please click the overlay to begin!
                        </div>
                    </div>
                </div>

                <div class="flex items-start gap-4 flex-row-reverse mt-auto">
                    <div class="flex flex-col flex-1 items-end">
                        <div class="flex items-center gap-3 mb-1 mr-2">
                            <span class="text-xs font-black text-slate-500">You</span>
                            <div class="flex items-center gap-1 bg-slate-100 px-2 py-1 rounded-full border border-slate-200">
                                <span class="text-[10px] font-bold text-emerald-600">MIC</span>
                                <div class="w-24 h-2 bg-slate-200 rounded-full overflow-hidden">
                                    <div id="mic-gauge" class="h-full bg-emerald-500 w-0 transition-all duration-75"></div>
                                </div>
                            </div>
                        </div>
                        <div id="user-bubble" class="bg-emerald-50 text-emerald-900 font-bold p-4 rounded-2xl rounded-tr-none border-2 border-emerald-200 shadow-sm text-[15px] leading-relaxed min-w-[50%] text-right">
                            <span id="user-text" class="italic text-emerald-600/70">Waiting for microphone...</span>
                            <div id="accuracy-text" class="text-[10px] text-emerald-500 font-black mt-1 hidden">Accuracy: 0%</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentLang = 'en-US'; 
        let currentChar = 'xeno';
        let masterVolume = 1;
        let isTutorSpeaking = false;
        let hasInitialized = false;

        const tutorBubble = document.getElementById('tutor-bubble');
        const userText = document.getElementById('user-text');
        const accuracyText = document.getElementById('accuracy-text');
        const micGauge = document.getElementById('mic-gauge');
        const canvasEl = document.getElementById('tutorCanvas');

        /* =========================================================
           렌더러 엔진 (로컬 스토리지 연동 제거 및 제공된 설정값 고정)
           ========================================================= */
        const renderer = {
            config: {
                "xena": { 
                    "maskType": "circle", "baseScale": 0.13, "baseX": -4, "baseY": 29, "eyeY": 224, 
                    "eyeSpacing": 70, "eyeWidth": 13, "eyeHeight": 13, "eyeLineThickness": 1.0, 
                    "pupilSize": 24, "pupilLeftOffsetX": 2.5, "pupilLeftOffsetY": 0, "pupilRightOffsetX": -3, 
                    "pupilRightOffsetY": 0, "eyebrowY": -36, "eyebrowLength": 21, "eyebrowAngle": -13, 
                    "eyebrowThickness": 3.0, "mouthY": 283, "mouthWidth": 33.5, "verticalLineLength": 11, 
                    "mouthCurve": 13, "mouthOffsetX": -1.0, "mouthOffsetY": 2.0, "mouthLineThickness": 1.5 
                },
                "xeno": { 
                    "maskType": "rounded-rect", "baseScale": 0.14, "baseX": 0, "baseY": 15, "eyeY": 195, 
                    "eyeSpacing": 64, "eyeWidth": 12, "eyeHeight": 12, "eyeLineThickness": 1.0, 
                    "pupilSize": 22, "pupilLeftOffsetX": 1.5, "pupilLeftOffsetY": 0, "pupilRightOffsetX": -1.5, 
                    "pupilRightOffsetY": 0, "eyebrowY": -28, "eyebrowLength": 22, "eyebrowAngle": 8, 
                    "eyebrowThickness": 3.0, "mouthY": 255, "mouthWidth": 26, "verticalLineLength": 8, 
                    "mouthCurve": 10, "mouthOffsetX": 0, "mouthOffsetY": 1.0, "mouthLineThickness": 1.5 
                }
            },
            simulation: { mouthOpen: 0, blinkState: 0, blinkTimer: 0, isSpeaking: false, vowel: 'A', speakIntervalId: null },
            ctx: null, images: { xena: new Image(), xeno: new Image() }, imageLoaded: { xena: false, xeno: false },
            
            init: function() {
                this.ctx = canvasEl.getContext('2d');
                
                this.images.xena.src = "Xena_base.png";
                this.images.xeno.src = "Xeno_base.png";
                this.images.xena.onload = () => { this.imageLoaded.xena = true; };
                this.images.xeno.onload = () => { this.imageLoaded.xeno = true; };
                this.applyMasking(currentChar);
                this.startLoop();
            },

            applyMasking: function(char) {
                const mask = this.config[char].maskType;
                if (mask === 'circle') canvasEl.style.borderRadius = "50%";
                else if (mask === 'rounded-rect') canvasEl.style.borderRadius = "12%";
            },

            startSpeakingAnim: function() {
                this.simulation.isSpeaking = true;
                canvasEl.classList.add('speaking-glow');
                const vowels = ['A', 'E', 'O'];
                let vIdx = 0;
                this.simulation.speakIntervalId = setInterval(() => {
                    this.simulation.mouthOpen = 4 + Math.random() * 8; 
                    this.simulation.vowel = vowels[vIdx];
                    vIdx = (vIdx + 1) % vowels.length;
                }, 130);
            },

            stopSpeakingAnim: function() {
                this.simulation.isSpeaking = false;
                canvasEl.classList.remove('speaking-glow');
                clearInterval(this.simulation.speakIntervalId);
                this.simulation.mouthOpen = 0;
            },

            startLoop: function() {
                const drawFrame = () => {
                    this.ctx.clearRect(0, 0, 400, 400); 
                    const breathe = Math.sin(Date.now() / 500) * 3.5;
                    
                    this.ctx.save();
                    this.ctx.beginPath();
                    if (this.config[currentChar].maskType === 'circle') this.ctx.arc(200, 200, 196, 0, Math.PI * 2);
                    else this.ctx.roundRect(4, 4, 392, 392, 48);
                    this.ctx.clip();
                    this.ctx.translate(200, 200 + breathe);

                    if (this.imageLoaded[currentChar]) {
                        const img = this.images[currentChar];
                        const cfg = this.config[currentChar];
                        const drawWidth = img.width * cfg.baseScale;
                        const drawHeight = img.height * cfg.baseScale;
                        this.ctx.drawImage(img, -drawWidth/2 + cfg.baseX, -drawHeight/2 + cfg.baseY, drawWidth, drawHeight);
                    } else {
                        this.drawBackupSilhouette();
                    }

                    this.drawVectorEyes();
                    this.drawVectorEyebrows();
                    this.drawVectorMouth();
                    this.ctx.restore();
                    
                    if (!this.simulation.isSpeaking) {
                        this.simulation.blinkTimer++;
                        if (this.simulation.blinkTimer > 200) {
                            this.simulation.blinkState = 1;
                            if (this.simulation.blinkTimer > 212) {
                                this.simulation.blinkState = 0;
                                this.simulation.blinkTimer = 0;
                            }
                        }
                    }
                    requestAnimationFrame(drawFrame);
                };
                drawFrame();
            },

            drawBackupSilhouette: function() {
                this.ctx.save();
                this.ctx.beginPath();
                if (currentChar === 'xena') {
                    this.ctx.arc(0, 20, 160, 0, Math.PI * 2);
                    this.ctx.fillStyle = "#e2e8f0"; this.ctx.fill();
                } else {
                    this.ctx.moveTo(-160, -20); this.ctx.lineTo(0, 160);
                    this.ctx.lineTo(160, -20); this.ctx.lineTo(0, -90);
                    this.ctx.closePath();
                    this.ctx.fillStyle = "#fef3c7"; this.ctx.fill();
                }
                this.ctx.fillStyle = "#475569"; this.ctx.font = "bold 16px sans-serif"; this.ctx.textAlign = "center";
                this.ctx.fillText(`[${currentChar}_base.png]`, 0, -10);
                this.ctx.fillText(`이미지 없음 (대체 렌더링)`, 0, 15);
                this.ctx.restore();
            },

            drawVectorEyes: function() {
                const cfg = this.config[currentChar];
                const halfSpacing = cfg.eyeSpacing / 2;
                const eyeYOff = cfg.eyeY - 200;
                const drawSingleEye = (ex, isLeft) => {
                    this.ctx.save();
                    if (this.simulation.blinkState === 1) {
                        this.ctx.beginPath();
                        this.ctx.arc(ex, eyeYOff + cfg.eyeHeight * 0.25, cfg.eyeWidth * 0.9, 0.1 * Math.PI, 0.9 * Math.PI, false);
                        this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.eyeLineThickness * 3.5; this.ctx.stroke();
                    } else {
                        this.ctx.beginPath();
                        this.ctx.ellipse(ex, eyeYOff, cfg.eyeWidth, cfg.eyeHeight, 0, 0, Math.PI * 2);
                        this.ctx.fillStyle = "#fff"; this.ctx.fill();
                        this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.eyeLineThickness || 1.5; this.ctx.stroke();

                        this.ctx.beginPath();
                        const pw = Math.min(cfg.eyeWidth * 0.85, cfg.pupilSize / 2);
                        const px = ex + (isLeft ? (cfg.pupilLeftOffsetX||0) : (cfg.pupilRightOffsetX||0));
                        const py = eyeYOff + (isLeft ? (cfg.pupilLeftOffsetY||0) : (cfg.pupilRightOffsetY||0));
                        this.ctx.ellipse(px, py, pw, pw, 0, 0, Math.PI * 2);
                        this.ctx.fillStyle = "#1e293b"; this.ctx.fill();
                        
                        this.ctx.beginPath();
                        this.ctx.arc(px - pw*0.35, py - pw*0.35, pw*0.35, 0, Math.PI*2);
                        this.ctx.fillStyle = "#fff"; this.ctx.fill();
                    }
                    this.ctx.restore();
                };
                drawSingleEye(-halfSpacing, true); drawSingleEye(halfSpacing, false);
            },

            drawVectorEyebrows: function() {
                const cfg = this.config[currentChar];
                const halfSpacing = cfg.eyeSpacing / 2;
                const browY = (cfg.eyeY - 200) + cfg.eyebrowY;
                const drawBrow = (bx, isLeft) => {
                    this.ctx.save();
                    this.ctx.translate(bx, browY);
                    this.ctx.rotate((cfg.eyebrowAngle * Math.PI / 180) * (isLeft ? 1 : -1));
                    this.ctx.beginPath();
                    const half = cfg.eyebrowLength / 2;
                    this.ctx.moveTo(-half, isLeft ? -1.5 : 1.5);
                    this.ctx.quadraticCurveTo(0, -cfg.eyebrowThickness * 1.5, half, isLeft ? 1.5 : -1.5);
                    this.ctx.strokeStyle = currentChar === 'xena' ? "#334155" : "#c2410c";
                    this.ctx.lineWidth = cfg.eyebrowThickness; this.ctx.lineCap = "round"; this.ctx.stroke();
                    this.ctx.restore();
                };
                drawBrow(-halfSpacing, true); drawBrow(halfSpacing, false);
            },

            drawVectorMouth: function() {
                const cfg = this.config[currentChar];
                this.ctx.save();
                this.ctx.translate(cfg.mouthOffsetX || 0, (cfg.mouthY - 200) + (cfg.mouthOffsetY || 0));

                if (this.simulation.mouthOpen > 1.5) {
                    const h = this.simulation.mouthOpen * (this.simulation.vowel === 'A' ? 1.5 : 1.0);
                    const top = cfg.mouthCurve, btm = top + h * 2.8;
                    
                    this.ctx.beginPath();
                    this.ctx.moveTo(-cfg.mouthWidth, -2);
                    this.ctx.quadraticCurveTo(0, top, cfg.mouthWidth, -2);
                    this.ctx.quadraticCurveTo(0, btm, -cfg.mouthWidth, -2);
                    this.ctx.fillStyle = "#881337"; this.ctx.fill();
                    
                    this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = cfg.mouthLineThickness || 1.5; this.ctx.stroke();
                } else {
                    this.ctx.beginPath();
                    this.ctx.moveTo(-cfg.mouthWidth, -2);
                    this.ctx.quadraticCurveTo(0, cfg.mouthCurve, cfg.mouthWidth, -2);
                    this.ctx.strokeStyle = "#1e293b"; this.ctx.lineWidth = (cfg.mouthLineThickness * 1.25) || 2.0;
                    this.ctx.lineCap = "round"; this.ctx.stroke();
                }
                this.ctx.restore();
            }
        };

        /* =========================================================
           UI 및 음성 인식 로직
           ========================================================= */
        function setLanguageMode(mode, silent = false) {
            document.getElementById('lang-en').className = "px-3 py-1 text-xs font-black text-slate-500 hover:bg-slate-200 rounded-lg transition";
            document.getElementById('lang-ko').className = "px-3 py-1 text-xs font-black text-slate-500 hover:bg-slate-200 rounded-lg transition";
            
            if (mode === 'en') {
                document.getElementById('lang-en').className = "px-3 py-1 text-xs font-black bg-slate-800 text-white rounded-lg transition shadow-sm";
                currentLang = 'en-US';
                if(!silent) tutorBubble.innerText = "[Notice] English mode selected.";
            } else if (mode === 'ko') {
                document.getElementById('lang-ko').className = "px-3 py-1 text-xs font-black bg-slate-800 text-white rounded-lg transition shadow-sm";
                currentLang = 'ko-KR';
                if(!silent) tutorBubble.innerText = "[알림] 한국어 모드가 선택되었습니다.";
            }
        }

        function setCharacter(char) {
            if(currentChar === char) return; 

            currentChar = char;
            document.getElementById('char-xeno').className = "px-8 py-2 text-sm font-black text-slate-500 hover:bg-slate-100 rounded-xl transition";
            document.getElementById('char-xena').className = "px-8 py-2 text-sm font-black text-slate-500 hover:bg-slate-100 rounded-xl transition";
            
            if (char === 'xeno') {
                document.getElementById('char-xeno').className = "px-8 py-2 text-sm font-black bg-orange-500 text-white rounded-xl transition";
                document.getElementById('body-bg').style.backgroundColor = '#f97316';
                speakText("Hello! I'm Xeno. Let's learn together!", true);
            } else {
                document.getElementById('char-xena').className = "px-8 py-2 text-sm font-black bg-blue-600 text-white rounded-xl transition";
                document.getElementById('body-bg').style.backgroundColor = '#0c4a6e';
                speakText("Hi there! I'm Xena. Ready to start?", true);
            }
            renderer.applyMasking(char);
        }

        function updateVolume(val) {
            masterVolume = parseFloat(val);
            if (masterVolume === 0 && speechSynthesis.speaking) {
                speechSynthesis.cancel();
                renderer.stopSpeakingAnim();
            }
        }

        let voices = [];
        speechSynthesis.onvoiceschanged = () => { voices = speechSynthesis.getVoices(); };

        function speakText(text, isInitial = false) {
            if (masterVolume === 0) return;
            speechSynthesis.cancel(); 
            
            isTutorSpeaking = true;
            if(recognition) recognition.stop(); 
            
            if(isInitial) {
                tutorBubble.innerText = text;
            }
            
            tutorBubble.classList.add('bubble-speaking');
            renderer.startSpeakingAnim(); 

            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = currentLang;
            utterance.volume = masterVolume;
            
            if (voices.length === 0) voices = speechSynthesis.getVoices();
            let bestVoice = voices.find(v => v.lang === currentLang && v.name.includes('Google')) || voices.find(v => v.lang === currentLang);
            if (bestVoice) utterance.voice = bestVoice;

            utterance.onend = () => {
                isTutorSpeaking = false;
                tutorBubble.classList.remove('bubble-speaking');
                renderer.stopSpeakingAnim(); 
                try { recognition.start(); } catch(e) {}
            };
            
            utterance.onerror = () => utterance.onend();
            speechSynthesis.speak(utterance);
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'ko-KR';

            recognition.onresult = (event) => {
                if (isTutorSpeaking) return;
                let interim = '', final = '', conf = 0;

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        final += event.results[i][0].transcript;
                        conf = event.results[i][0].confidence;
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }

                if (final !== '') {
                    const hasKorean = /[가-힣]/.test(final);
                    const hasEnglish = /[a-zA-Z]/.test(final);
                    
                    if (hasKorean) setLanguageMode('ko', true);
                    else if (hasEnglish && !hasKorean) setLanguageMode('en', true);
                    
                    userText.innerText = final;
                    userText.classList.remove('italic', 'text-emerald-600/70');
                    userText.classList.add('text-emerald-900');
                    
                    accuracyText.style.display = 'block';
                    accuracyText.innerText = `Accuracy: ${Math.round(conf * 100)}%`;
                } else {
                    userText.innerText = interim;
                }
            };

            recognition.onend = () => {
                if (!isTutorSpeaking && hasInitialized) {
                    try { recognition.start(); } catch(e) {}
                }
            };
        }

        async function initApp() {
            if(hasInitialized) return;
            hasInitialized = true;
            document.getElementById('start-overlay').style.display = 'none';
            setLanguageMode('en', true);

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaStreamSource(stream);
                const scriptNode = audioCtx.createScriptProcessor(1024, 1, 1);

                analyser.smoothingTimeConstant = 0.8;
                analyser.fftSize = 512;
                source.connect(analyser);
                analyser.connect(scriptNode);
                scriptNode.connect(audioCtx.destination);

                scriptNode.onaudioprocess = () => {
                    if (isTutorSpeaking) {
                        micGauge.style.width = '0%'; return;
                    }
                    const array = new Uint8Array(analyser.frequencyBinCount);
                    analyser.getByteFrequencyData(array);
                    let sum = 0;
                    for (let i = 0; i < array.length; i++) sum += array[i];
                    micGauge.style.width = Math.min(100, (sum / array.length) * 3) + '%';
                };

                userText.innerText = "Listening...";
                if(recognition) recognition.start();
                
            } catch (err) {
                userText.innerText = "Mic access denied.";
            }

            setTimeout(() => {
                speakText("Hello! I am Xeno. Let's practice speaking!", true);
            }, 500);
        }

        window.onload = () => {
            renderer.init();
        };
    </script>
</body>
</html>
